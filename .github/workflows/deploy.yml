##
## MediHawk — Deploy to Render (backend) + Vercel (frontend)
##
## Triggers:
##   • push to main
##   • manual dispatch (Actions → Run workflow)
##
## Gates before deploying:
##   • Backend: 425 pytest tests against real PostgreSQL 16
##   • Frontend: TypeScript check + Vite production build
##
## Required GitHub Secrets (Settings → Secrets → Actions):
##   RENDER_DEPLOY_HOOK_URL   — from Render dashboard: Service → Settings → Deploy Hook
##   VERCEL_TOKEN             — from vercel.com/account/tokens
##   VERCEL_ORG_ID            — from vercel.com/account → Team ID (or personal account ID)
##   VERCEL_PROJECT_ID        — from project Settings → General → Project ID
##   VITE_API_BASE_URL        — optional override for frontend API URL in CI build
##                              (defaults to https://medihawk3.onrender.com if unset)
##                              also set this in Vercel project environment variables
##

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. Backend tests against real PostgreSQL 16 ──────────────────────────────
  test-backend:
    name: Backend tests (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medihawk_test
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'ci-temp-pw' }}
          POSTGRES_DB: medihawk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medihawk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest (PostgreSQL)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://medihawk_test:${{ secrets.TEST_DB_PASSWORD || 'ci-temp-pw' }}@localhost:5432/medihawk_test
        run: pytest -q --tb=short

  # ── 2. Frontend: TypeScript check + production build ─────────────────────────
  build-frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vite production build
        env:
          # VITE_API_BASE_URL is required by vite.config.ts in production mode.
          # If the secret is unset, default to the production Render backend URL.
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://medihawk3.onrender.com}"
          npm run build

  # ── 3. Deploy backend to Render ───────────────────────────────────────────────
  deploy-backend:
    name: Deploy backend → Render
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    environment:
      name: production
      url: https://medihawk3.onrender.com

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            --retry 3 --retry-delay 5
        # RENDER_DEPLOY_HOOK_URL: Render dashboard → Service → Settings → Deploy Hook
        # The hook URL already encodes the service ID + deploy key — no extra auth needed.

  # ── 4. Deploy frontend to Vercel ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend → Vercel
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    environment:
      name: production
      url: https://medihawk.vercel.app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (production)
        run: |
          vercel deploy --prod --yes \
            --token "${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
